name: Build and verify PyNexus APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pynexus-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool aapt aapt2 zipalign apksigner default-jdk-headless python3
      - name: Validate repository scripts
        run: |
          python3 -m py_compile scripts/reassemble.py scripts/normalize_resources.py
          bash -n scripts/build.sh
      - name: Build, align, sign and verify
        env:
          PYNEXUS_KEYSTORE_B64: ${{ secrets.PYNEXUS_KEYSTORE_B64 }}
          PYNEXUS_STORE_PASSWORD: ${{ secrets.PYNEXUS_STORE_PASSWORD }}
        run: bash scripts/build.sh
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PyNexus-signed-apk
          path: build/PyNexus-signed.apk
          if-no-files-found: error
          retention-days: 30
